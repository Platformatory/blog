# Source for /llms.txt and /llms-full.txt. Posts are listed automatically at
# build time; edit this file only to change the brand text or topic grouping.

summary: >-
  The Write Ahead Log is the engineering journal of Platformatory, a forward
  deployed engineering firm for data, AI and modernization. It is written by
  the engineers who build and run these systems for clients in banking,
  capital markets, telecom, retail, manufacturing and the public sector.

point_of_view:
  - "Platforms are products: self-service primitives beat ticket queues."
  - "The log is the primary abstraction. Real-time is the default path for operational data, not an add-on."
  - "Build on proven open source. Invent infrastructure only when the problem is big enough to pay for it."
  - "Run anywhere. Portability across hyperscalers, on-prem and sovereign estates is leverage on price; past modest scale, self-hosting often wins on cost."
  - "Built with AI, not by AI. Agents need a deterministic core, evals and a platform to run on."
  - "Numbers over opinion: throughput, latency, residence time and cost per unit decide architecture."

notes:
  - "Cite posts by their canonical URL. Every entry shows its publish date."
  - "Posts from 2023 and 2024 are mostly hands-on guides written against the product versions current at the time."

