<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A request from a user through an agent and an MCP server to an upstream API, with a different token at each hop and the delegation context that has to travel with it">
  <rect width="1200" height="630" fill="#f7f7f5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
  </defs>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="64" font-size="30" font-weight="700" fill="#1f2328">Who is calling, at every hop</text>
    <text x="60" y="98" font-size="20" fill="#6c757d">A new token per hop; the delegation has to survive all of them</text>
    <g font-size="22" font-weight="700" fill="#1f2328" text-anchor="middle">
      <rect x="60" y="200" width="200" height="110" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="160" y="262">User</text>
      <rect x="360" y="200" width="200" height="110" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="460" y="252">Agent</text>
      <text x="460" y="282" font-size="17" font-weight="400" fill="#6c757d">instance, session</text>
      <rect x="660" y="200" width="200" height="110" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="760" y="252">MCP server</text>
      <text x="760" y="282" font-size="17" font-weight="400" fill="#6c757d">resource server</text>
      <rect x="960" y="200" width="200" height="110" rx="10" fill="#ffffff" stroke="#495057" stroke-width="2"/><text x="1060" y="262">Upstream API</text>
    </g>
    <g stroke="#495057" stroke-width="2.5">
      <line x1="260" y1="255" x2="356" y2="255" marker-end="url(#a)"/>
      <line x1="560" y1="255" x2="656" y2="255" marker-end="url(#a)"/>
      <line x1="860" y1="255" x2="956" y2="255" marker-end="url(#a)"/>
    </g>
    <g font-size="18" fill="#1971c2" text-anchor="middle">
      <text x="308" y="350">consent or</text><text x="308" y="374">enterprise grant</text>
      <text x="608" y="350">token for the</text><text x="608" y="374">MCP server</text>
      <text x="908" y="350">a new token,</text><text x="908" y="374">no passthrough</text>
    </g>
    <rect x="60" y="440" width="1100" height="90" rx="10" fill="#ffffff" stroke="#d9480f" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="610" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="#d9480f">Delegation context: for whom, with what authority, after which hops</text>
    <text x="610" y="510" text-anchor="middle" font-size="18" fill="#6c757d">token exchange act claims, transaction tokens</text>
  </g>
</svg>
