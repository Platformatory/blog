<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An Oracle XStream CDC pipeline: redo, capture, buffered queue with spill to disk, outbound server, connector, producer and broker, with the metric to watch at each stage and the processed low position acknowledged back to the outbound server"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker></defs><rect width="1200" height="630" fill="#ffffff"/><text x="600" y="62" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328">Where an Oracle change waits on its way to Kafka</text><rect x="25" y="100" width="640" height="330" rx="14" fill="#f7f7f5" stroke="#adb5bd" stroke-width="1.5"/><text x="345.0" y="128" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6c757d">Oracle database (SGA, Streams pool)</text><rect x="680" y="100" width="330" height="330" rx="14" fill="#f7f7f5" stroke="#adb5bd" stroke-width="1.5"/><text x="845.0" y="128" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6c757d">Kafka Connect (JVM)</text><rect x="1025" y="100" width="150" height="330" rx="14" fill="#f7f7f5" stroke="#adb5bd" stroke-width="1.5"/><text x="1100.0" y="128" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#6c757d">Kafka</text><rect x="40" y="190" width="135" height="100" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2.5"/><text x="107.5" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2328">Redo</text><text x="107.5" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c757d">online, archived</text><text x="107.5" y="318" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">redo MB/s</text><line x1="177" y1="240.0" x2="192" y2="240.0" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a)"/><rect x="195" y="190" width="135" height="100" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2.5"/><text x="262.5" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2328">Capture</text><text x="262.5" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c757d">redo to LCRs</text><text x="262.5" y="318" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">checkpoint SCN</text><line x1="332" y1="240.0" x2="347" y2="240.0" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a)"/><rect x="350" y="190" width="135" height="100" rx="10" fill="#fff" stroke="#d9480f" stroke-width="2.5"/><text x="417.5" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2328">Buffered queue</text><text x="417.5" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c757d">held to commit</text><text x="417.5" y="318" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#d9480f">pool use, spill</text><line x1="487" y1="240.0" x2="502" y2="240.0" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a)"/><rect x="505" y="190" width="135" height="100" rx="10" fill="#fff" stroke="#1f2328" stroke-width="2.5"/><text x="572.5" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2328">Outbound</text><text x="572.5" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c757d">whole transactions</text><text x="572.5" y="318" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">low watermark</text><line x1="642" y1="240.0" x2="692" y2="240.0" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a)"/><rect x="695" y="190" width="135" height="100" rx="10" fill="#fff" stroke="#1971c2" stroke-width="2.5"/><text x="762.5" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2328">Connector</text><text x="762.5" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c757d">LCR to record</text><text x="762.5" y="318" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1971c2">queue capacity</text><line x1="832" y1="240.0" x2="852" y2="240.0" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a)"/><rect x="855" y="190" width="135" height="100" rx="10" fill="#fff" stroke="#1971c2" stroke-width="2.5"/><text x="922.5" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2328">Producer</text><text x="922.5" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c757d">batch, compress</text><text x="922.5" y="318" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1971c2">request latency</text><line x1="992" y1="240.0" x2="1032" y2="240.0" stroke="#1f2328" stroke-width="2.5" marker-end="url(#a)"/><rect x="1035" y="190" width="130" height="100" rx="10" fill="#fff" stroke="#1971c2" stroke-width="2.5"/><text x="1100.0" y="234" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1f2328">Broker</text><text x="1100.0" y="260" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6c757d">replicate, ack</text><text x="1100.0" y="318" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1971c2">replication</text><rect x="360" y="360" width="115" height="46" rx="8" fill="#fff" stroke="#d9480f" stroke-width="2" stroke-dasharray="8 6"/><text x="417" y="389" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#d9480f">spill to disk</text><line x1="417" y1="328" x2="417" y2="357" stroke="#d9480f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/><path d="M762 190 C 762 152, 572 152, 572 187" fill="none" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#b)"/><text x="667" y="156" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#d9480f">acks: processed low position</text><line x1="45" y1="490" x2="1155" y2="490" stroke="#1f2328" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/><text x="600" y="478" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328">freshness: commit to Kafka, p99</text><text x="600" y="530" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c757d">Recovery: redo kept back to the oldest required SCN, drained with spare capacity</text><text x="600" y="580" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#6c757d">Little’s law: events in flight = throughput × residence time</text></svg>