<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The agentic streaming stack: most 2026 launches sit on layers that already existed; the new pressures are replay, delegated authority, cost per message, threat response and continual learning">
  <rect width="1200" height="630" fill="#f7f7f5"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="64" font-size="30" font-weight="700" fill="#1f2328">Old wine, new bottles</text>
    <text x="60" y="98" font-size="20" fill="#6c757d">2026 agent launches, by the layer they already sat on</text>

    <!-- stack -->
    <g font-size="20">
      <rect x="60" y="130" width="700" height="78" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="80" y="164" font-weight="700" fill="#1f2328">Agents</text>
      <text x="80" y="192" fill="#495057">Streaming Agents, Flink Agents: inference in an operator</text>

      <rect x="60" y="218" width="700" height="78" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="80" y="252" font-weight="700" fill="#1f2328">Serve</text>
      <text x="80" y="280" fill="#495057">Lightning Tables, context engines: materialized views</text>

      <rect x="60" y="306" width="700" height="78" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="80" y="340" font-weight="700" fill="#1f2328">Govern</text>
      <text x="80" y="368" fill="#495057">AI gateways, agent data planes: API gateway and IdP</text>

      <rect x="60" y="394" width="700" height="78" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="80" y="428" font-weight="700" fill="#1f2328">Log</text>
      <text x="80" y="456" fill="#495057">Kafka, share groups, action logs: queues, event sourcing</text>

      <rect x="60" y="482" width="700" height="78" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="80" y="516" font-weight="700" fill="#1f2328">Store</text>
      <text x="80" y="544" fill="#495057">Diskless topics, Iceberg, streamhouse: cost architecture</text>
    </g>

    <!-- new pressures -->
    <rect x="800" y="130" width="340" height="430" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/>
    <text x="824" y="170" font-size="22" font-weight="700" fill="#d9480f">Genuinely new</text>
    <g font-size="20" fill="#1f2328">
      <text x="824" y="222">Replay no longer</text>
      <text x="824" y="248">reproduces</text>
      <text x="824" y="298">Consumers act on</text>
      <text x="824" y="324">delegated authority</text>
      <text x="824" y="374">Every message</text>
      <text x="824" y="400">costs money</text>
      <text x="824" y="450" fill="#1971c2" font-weight="700">Machine-speed</text>
      <text x="824" y="476" fill="#1971c2" font-weight="700">threat response</text>
      <text x="824" y="526" fill="#1971c2" font-weight="700">Continual learning</text>
    </g>
    <line x1="760" y1="345" x2="800" y2="345" stroke="#d9480f" stroke-width="2.5"/>
    <text x="60" y="600" font-size="18" fill="#6c757d">Grey: patterns Kafka users already run. Orange: new consumer properties. Blue: new use-cases.</text>
  </g>
</svg>
