<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-label="Business value against cost to adopt for thirteen agentic streaming opportunities, scored 1 to 5">
  <rect width="760" height="520" fill="#ffffff"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <g stroke="#e9ecef">
      <line x1="90" y1="470" x2="720" y2="470"/><line x1="90" y1="372" x2="720" y2="372"/><line x1="90" y1="275" x2="720" y2="275"/><line x1="90" y1="177" x2="720" y2="177"/><line x1="90" y1="79" x2="720" y2="79"/>
      <line x1="157" y1="40" x2="157" y2="470"/><line x1="291" y1="40" x2="291" y2="470"/><line x1="425" y1="40" x2="425" y2="470"/><line x1="559" y1="40" x2="559" y2="470"/><line x1="693" y1="40" x2="693" y2="470"/>
    </g>
    <g stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 5">
      <line x1="425" y1="40" x2="425" y2="470"/><line x1="90" y1="275" x2="720" y2="275"/>
    </g>
    <line x1="90" y1="470" x2="720" y2="470" stroke="#868e96"/>
    <line x1="90" y1="40" x2="90" y2="470" stroke="#868e96"/>
    <g font-size="14" fill="#6c757d">
      <text x="157" y="490" text-anchor="middle">1</text><text x="291" y="490" text-anchor="middle">2</text><text x="425" y="490" text-anchor="middle">3</text><text x="559" y="490" text-anchor="middle">4</text><text x="693" y="490" text-anchor="middle">5</text>
      <text x="80" y="475" text-anchor="end">1</text><text x="80" y="377" text-anchor="end">2</text><text x="80" y="280" text-anchor="end">3</text><text x="80" y="182" text-anchor="end">4</text><text x="80" y="84" text-anchor="end">5</text>
      <text x="405" y="512" text-anchor="middle">Cost to adopt and run</text>
      <text x="30" y="255" text-anchor="middle" transform="rotate(-90 30 255)">Business value</text>
    </g>
    <g font-size="14" fill="#868e96" font-style="italic">
      <text x="100" y="58">Do now</text>
      <text x="712" y="58" text-anchor="end">Strategic bets</text>
      <text x="100" y="460">Take if free</text>
      <text x="712" y="460" text-anchor="end">Avoid unless event-born</text>
    </g>
    <g fill="#868e96" stroke="#ffffff" stroke-width="2">
      <circle cx="425" cy="372" r="7"/><circle cx="559" cy="372" r="7"/><circle cx="291" cy="294" r="7"/><circle cx="157" cy="372" r="7"/>
      <circle cx="358" cy="270" r="7"/><circle cx="197" cy="177" r="7"/><circle cx="157" cy="421" r="7"/><circle cx="398" cy="206" r="7"/>
    </g>
    <g fill="#d9480f" stroke="#ffffff" stroke-width="2">
      <path d="M291,147 L301,165 L281,165 Z"/><path d="M479,147 L489,165 L469,165 Z"/><path d="M264,206 L274,224 L254,224 Z"/>
      <path d="M626,69 L636,87 L616,87 Z"/><path d="M506,118 L516,136 L496,136 Z"/>
    </g>
    <g font-size="14" fill="#1f2328">
      <text x="437" y="377">Context engines</text>
      <text x="559" y="398" text-anchor="middle">Streaming and Flink Agents</text>
      <text x="303" y="299">Forecast triggers agent</text>
      <text x="169" y="377">Share groups</text>
      <text x="370" y="262">AI gateway</text>
      <text x="209" y="182">Action log</text>
      <text x="169" y="426">MCP tooling</text>
      <text x="410" y="211">Diskless storage</text>
    </g>
    <g font-size="14" fill="#d9480f" font-weight="700">
      <text x="303" y="162">Record and replay</text>
      <text x="491" y="162">Delegated principal</text>
      <text x="250" y="221" text-anchor="end">Budget backpressure</text>
      <text x="612" y="84" text-anchor="end">Threat response</text>
      <text x="518" y="133">Continual learning</text>
