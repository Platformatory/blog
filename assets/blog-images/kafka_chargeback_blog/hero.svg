<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Chargeback for a shared Kafka cluster: fixed costs (brokers, tooling, people) and variable costs (network, storage) are measured per tenant through Prometheus and split by one of three models, cost centre, resource usage or client usage, into a bill for each team.">
  <rect width="1200" height="630" fill="#f7f7f5"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="64" font-size="30" font-weight="700" fill="#1f2328">Chargeback for shared Kafka clusters</text>
    <text x="60" y="98" font-size="20" fill="#6c757d">From cluster cost to a bill per team</text>
    <g font-size="20">
      <rect x="60" y="140" width="300" height="190" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="80" y="176" font-weight="700" fill="#1f2328">Fixed costs</text>
      <text x="80" y="208" fill="#495057">brokers, controllers,</text><text x="80" y="234" fill="#495057">Schema Registry</text>
      <text x="80" y="262" fill="#495057">monitoring and SIEM</text><text x="80" y="290" fill="#495057">administrators, support</text>
      <rect x="60" y="350" width="300" height="140" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="80" y="386" font-weight="700" fill="#1f2328">Variable costs</text>
      <text x="80" y="418" fill="#495057">network throughput,</text><text x="80" y="444" fill="#495057">connections, storage</text>
      <rect x="430" y="230" width="260" height="170" rx="8" fill="#e7f1fb" stroke="#1971c2"/>
      <text x="560" y="290" text-anchor="middle" font-weight="700" fill="#1f2328">Usage per tenant</text>
      <text x="560" y="322" text-anchor="middle" fill="#495057">partitions, bytes in/out,</text><text x="560" y="348" text-anchor="middle" fill="#495057">disk, client throughput</text>
      <text x="560" y="380" text-anchor="middle" fill="#1971c2">via Prometheus</text>
      <rect x="760" y="140" width="380" height="80" rx="8" fill="#ffffff" stroke="#d9480f"/>
      <text x="780" y="174" font-weight="700" fill="#1f2328">Cost centre</text><text x="780" y="204" fill="#495057">fair share of the total cost</text>
      <rect x="760" y="240" width="380" height="80" rx="8" fill="#ffffff" stroke="#d9480f"/>
      <text x="780" y="274" font-weight="700" fill="#1f2328">Resource usage</text><text x="780" y="304" fill="#495057">unit price per partition, GB, MB/s</text>
      <rect x="760" y="340" width="380" height="80" rx="8" fill="#ffffff" stroke="#d9480f"/>
      <text x="780" y="374" font-weight="700" fill="#1f2328">Client usage</text><text x="780" y="404" fill="#495057">what each team produces and reads</text>
      <rect x="760" y="460" width="380" height="70" rx="8" fill="#1f2328"/>
      <text x="950" y="503" text-anchor="middle" font-weight="700" fill="#ffffff">A bill per team</text>
    </g>
    <g stroke="#495057" stroke-width="3" fill="none"><path d="M360 235 L430 290"/><path d="M360 420 L430 350"/><path d="M690 290 L760 180"/><path d="M690 315 L760 280"/><path d="M690 340 L760 380"/><path d="M950 420 V460"/></g>
  </g>
</svg>
