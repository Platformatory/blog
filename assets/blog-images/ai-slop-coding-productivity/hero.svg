<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Delivery when agents write the code: a person writes the spec, agents generate code ten times faster, pull requests pile up in the review queue, machine checks send failures back, and a named person signs off"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker></defs><rect width="1200" height="630" fill="#ffffff"/><rect width="1200" height="630" fill="#f7f7f5"/><rect x="30" y="230" width="205" height="130" rx="12" fill="#fff" stroke="#d9480f" stroke-width="3"/><text x="132.5" y="291.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Spec + invariants</text><text x="132.5" y="319.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#6c757d">a person</text><line x1="235" y1="295" x2="258" y2="295" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><rect x="260" y="230" width="205" height="130" rx="12" fill="#fff" stroke="#1971c2" stroke-width="3"/><text x="362.5" y="291.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Agents write code</text><text x="362.5" y="319.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#6c757d">10× faster</text><line x1="465" y1="295" x2="488" y2="295" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><rect x="490" y="230" width="205" height="130" rx="12" fill="#fff" stroke="#d9480f" stroke-width="3"/><text x="592.5" y="291.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Review queue</text><text x="592.5" y="319.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#6c757d">the bottleneck</text><line x1="695" y1="295" x2="718" y2="295" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><rect x="720" y="230" width="205" height="130" rx="12" fill="#fff" stroke="#1971c2" stroke-width="3"/><text x="822.5" y="291.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Checks</text><text x="822.5" y="319.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#6c757d">tests, proofs, scans</text><line x1="925" y1="295" x2="948" y2="295" stroke="#1f2328" stroke-width="3" marker-end="url(#a)"/><rect x="950" y="230" width="205" height="130" rx="12" fill="#fff" stroke="#d9480f" stroke-width="3"/><text x="1052.5" y="291.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Sign-off</text><text x="1052.5" y="319.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#6c757d">a named person</text><rect x="520" y="150" width="140" height="44" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect x="530" y="138" width="140" height="44" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect x="540" y="126" width="140" height="44" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect x="550" y="114" width="140" height="44" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="2"/><rect x="560" y="102" width="140" height="44" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="2"/><text x="592.5" y="65" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22"