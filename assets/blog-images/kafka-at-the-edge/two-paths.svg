<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="A bridged path through an MQTT broker, a bridge and Kafka, compared with a single write to an edge log forwarding to cloud streaming">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
  </defs>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">
    <text x="20" y="30" font-size="17" font-weight="700">Bridged path</text>
    <rect x="20" y="45" width="120" height="60" rx="8" fill="#f7f7f5" stroke="#868e96"/><text x="80" y="80" text-anchor="middle">Device</text>
    <rect x="180" y="45" width="150" height="60" rx="8" fill="#ffffff" stroke="#868e96"/><text x="255" y="72" text-anchor="middle" font-weight="700">MQTT broker</text><text x="255" y="92" text-anchor="middle" font-size="13" fill="#495057">0.3–3.7 GB, ack in memory</text>
    <rect x="370" y="45" width="150" height="60" rx="8" fill="#ffffff" stroke="#868e96"/><text x="445" y="72" text-anchor="middle" font-weight="700">Bridge</text><text x="445" y="92" text-anchor="middle" font-size="13" fill="#495057">up to 2 GB, batches</text>
    <rect x="560" y="45" width="180" height="60" rx="8" fill="#ffffff" stroke="#868e96"/><text x="650" y="72" text-anchor="middle" font-weight="700">Kafka broker</text><text x="650" y="92" text-anchor="middle" font-size="13" fill="#495057">1 GB heap</text>
    <line x1="140" y1="75" x2="176" y2="75" stroke="#495057" stroke-width="2" marker-end="url(#a)"/>
    <line x1="330" y1="75" x2="366" y2="75" stroke="#495057" stroke-width="2" marker-end="url(#a)"/>
    <line x1="520" y1="75" x2="556" y2="75" stroke="#495057" stroke-width="2" marker-end="url(#a)"/>
    <text x="20" y="140" font-size="14" fill="#495057">3 processes · 2 translations · backlog persists only if configured</text>

    <line x1="20" y1="175" x2="740" y2="175" stroke="#e9ecef"/>

    <text x="20" y="215" font-size="17" font-weight="700">Edge log</text>
    <rect x="20" y="230" width="120" height="60" rx="8" fill="#f7f7f5" stroke="#868e96"/><text x="80" y="265" text-anchor="middle">Device</text>
    <rect x="180" y="230" width="340" height="60" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="2.5"/><text x="350" y="257" text-anchor="middle" font-weight="700">Kafka-protocol log (MQTT, HTTP, Kafka in)</text><text x="350" y="277" text-anchor="middle" font-size="13" fill="#495057">sync write before ack</text>
    <rect x="560" y="230" width="180" height="60" rx="8" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><text x="650" y="265" text-anchor="middle" font-weight="700">Cloud streaming</text>
    <line x1="140" y1="260" x2="176" y2="260" stroke="#495057" stroke-width="2" marker-end="url(#a)"/>
    <line x1="520" y1="260" x2="556" y2="260" stroke="#1971c2" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
    <text x="20" y="325" font-size="14" fill="#495057">1 process · 0 translations · acknowledged data on disk · async upstream</text>
    <text x="20" y="375" font-size="13" fill="#6c757d">Memory from published benchmark ranges and Apache Kafka start-up defaults.</text>
  </g>
</svg>
