<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The experiment: the same Kafka topic feeds a PySpark Structured Streaming job in micro-batches and a PyFlink job record at a time; both write back to Kafka, and end-to-end latency is the sink timestamp minus the source timestamp, at p50, p95 and p99.">
  <rect width="1200" height="630" fill="#f7f7f5"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="64" font-size="30" font-weight="700" fill="#1f2328">Flink vs Spark on the same Kafka stream</text>
    <text x="60" y="98" font-size="20" fill="#6c757d">Stateless and stateful pipelines, with and without an Avro schema</text>
    <g font-size="20">
      <rect x="60" y="230" width="200" height="120" rx="8" fill="#ffffff" stroke="#1f2328"/>
      <text x="160" y="280" text-anchor="middle" font-weight="700" fill="#1f2328">Kafka</text><text x="160" y="310" text-anchor="middle" fill="#495057">source topic</text><text x="160" y="335" text-anchor="middle" fill="#6c757d">KRaft cluster</text>
      <rect x="420" y="150" width="360" height="110" rx="8" fill="#ffffff" stroke="#adb5bd"/>
      <text x="600" y="195" text-anchor="middle" font-weight="700" fill="#1f2328">PySpark Structured Streaming</text>
      <text x="600" y="228" text-anchor="middle" fill="#495057">micro-batches</text>
      <g fill="#adb5bd"><rect x="470" y="238" width="40" height="12"/><rect x="530" y="238" width="40" height="12"/><rect x="590" y="238" width="40" height="12"/><rect x="650" y="238" width="40" height="12"/></g>
      <rect x="420" y="320" width="360" height="110" rx="8" fill="#ffffff" stroke="#d9480f"/>
      <text x="600" y="365" text-anchor="middle" font-weight="700" fill="#1f2328">PyFlink</text>
      <text x="600" y="398" text-anchor="middle" fill="#495057">record at a time</text>
      <g fill="#d9480f"><circle cx="480" cy="414" r="5"/><circle cx="510" cy="414" r="5"/><circle cx="540" cy="414" r="5"/><circle cx="570" cy="414" r="5"/><circle cx="600" cy="414" r="5"/><circle cx="630" cy="414" r="5"/><circle cx="660" cy="414" r="5"/><circle cx="690" cy="414" r="5"/><circle cx="720" cy="414" r="5"/></g>
      <rect x="940" y="230" width="200" height="120" rx="8" fill="#ffffff" stroke="#1f2328"/>
      <text x="1040" y="280" text-anchor="middle" font-weight="700" fill="#1f2328">Kafka</text><text x="1040" y="310" text-anchor="middle" fill="#495057">sink topic</text>
    </g>
    <g stroke="#495057" stroke-width="3" fill="none"><path d="M260 270 L420 205"/><path d="M260 310 L420 375"/><path d="M780 205 L940 270"/><path d="M780 375 L940 310"/></g>
    <rect x="60" y="480" width="1080" height="80" rx="8" fill="#ffffff" stroke="#1971c2"/>
    <text x="600" y="516" text-anchor="middle" font-size="22" font-weight="700" fill="#1971c2">latency = processed timestamp - source timestamp</text>
    <text x="600" y="545" text-anchor="middle" font-size="20" fill="#495057">reported at p50, p95 and p99 across every record</text>
  </g>
</svg>
