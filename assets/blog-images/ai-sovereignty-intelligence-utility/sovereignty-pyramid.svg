<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Hierarchy of AI sovereignty: operational, data, model, compute, industrial"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker></defs><rect width="720" height="430" fill="#ffffff"/><polygon points="240,30.0 480,30.0 518,98.0 202,98.0" fill="#fff" stroke="#d9480f" stroke-width="2.5"/><text x="360" y="63.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Industrial sovereignty</text><text x="360" y="81.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c757d">fabs · lithography · optics · tools</text><polygon points="194,104.0 526,104.0 564,172.0 156,172.0" fill="#fff" stroke="#6c757d" stroke-width="2.5"/><text x="360" y="137.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Compute security</text><text x="360" y="155.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c757d">accelerators via stockpiles, contracts, allies</text><polygon points="148,178.0 572,178.0 610,246.0 110,246.0" fill="#fff" stroke="#1971c2" stroke-width="2.5"/><text x="360" y="211.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Model sovereignty</text><text x="360" y="229.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c757d">domain and regional models, distilled</text><polygon points="102,252.0 618,252.0 656,320.0 64,320.0" fill="#fff" stroke="#1971c2" stroke-width="2.5"/><text x="360" y="285.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Data sovereignty</text><text x="360" y="303.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c757d">your data, your law, your languages</text><polygon points="56,326.0 664,326.0 702,394.0 18,394.0" fill="#fff" stroke="#1971c2" stroke-width="2.5"/><text x="360" y="359.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">Operational sovereignty</text><text x="360" y="377.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c757d">keeps running if a provider says no</text><text x="360" y="424" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1971c2">the base: secure this first</text></svg>