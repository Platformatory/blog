<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The AI supply chain as turtles all the way down: AI product, model, accelerator, fabrication, EUV lithography, optics and light source, precision machine tools, and materials and power"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker></defs><rect width="1200" height="630" fill="#ffffff"/><rect width="1200" height="630" fill="#f7f7f5"/><text x="600" y="44" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">turtles all the way down: each layer wraps the one beneath it</text><rect x="80" y="64" width="1040" height="58" rx="14" fill="#fff" stroke="#1971c2" stroke-width="3"/><text x="110" y="101" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">AI product</text><text x="1090" y="101" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">a wrapper around a model API</text><rect x="94" y="129" width="1012" height="58" rx="14" fill="#fff" stroke="#1971c2" stroke-width="3"/><text x="124" y="166" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">Model</text><text x="1076" y="166" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">a wrapper around GPUs or TPUs</text><rect x="108" y="194" width="984" height="58" rx="14" fill="#fff" stroke="#6c757d" stroke-width="3"/><text x="138" y="231" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">Accelerator</text><text x="1062" y="231" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">design (the visible moat) + memory from 3 suppliers</text><rect x="122" y="259" width="956" height="58" rx="14" fill="#fff" stroke="#6c757d" stroke-width="3"/><text x="152" y="296" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">Fabrication</text><text x="1048" y="296" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">one foundry with ~70% of revenue</text><rect x="136" y="324" width="928" height="58" rx="14" fill="#fff" stroke="#d9480f" stroke-width="3"/><text x="166" y="361" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">EUV lithography</text><text x="1034" y="361" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">one Dutch maker: ASML</text><rect x="150" y="389" width="900" height="58" rx="14" fill="#fff" stroke="#d9480f" stroke-width="3"/><text x="180" y="426" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">Optics + light source</text><text x="1020" y="426" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">Zeiss optics · US light source · German lasers</text><rect x="164" y="454" width="872" height="58" rx="14" fill="#fff" stroke="#d9480f" stroke-width="3"/><text x="194" y="491" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">Precision machine tools</text><text x="1006" y="491" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">the machines that make the machines</text><rect x="178" y="519" width="844" height="58" rx="14" fill="#fff" stroke="#d9480f" stroke-width="3"/><text x="208" y="556" text-anchor="start" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#1f2328">Materials + power</text><text x="992" y="556" text-anchor="end" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6c757d">neon · high-purity quartz · chemicals · electricity</text></svg>