<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 986 446" role="img" aria-label="Operational sovereignty as a system: a policy router inside the jurisdiction sends work to a shared domestic serving pool of open-weight and distilled domain models on local GPUs, with a model registry, evaluation harness and distillation pipeline; the foreign frontier API is optional for non-sensitive work and serves mainly as a teacher under contract"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker></defs><rect width="986" height="446" fill="#ffffff"/><text x="390" y="26" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Inside the jurisdiction</text><rect x="20" y="38" width="740" height="372" rx="12" fill="#f7f7f5" stroke="#adb5bd"/><rect x="40" y="60" width="150" height="54" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="115.0" y="83.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Users and agents</text><text x="115.0" y="101.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">agencies, companies</text><line x1="190" y1="87" x2="232" y2="87" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><rect x="234" y="56" width="190" height="62" rx="8" fill="#fff" stroke="#d9480f" stroke-width="2"/><text x="329.0" y="74.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Policy router</text><text x="329.0" y="92.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">data class, residency,</text><text x="329.0" y="110.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">failover</text><rect x="40" y="148" width="430" height="168" rx="10" fill="#fff" stroke="#1971c2" stroke-width="2"/><text x="255" y="170" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1971c2">Domestic serving pool (shared, high utilisation)</text><rect x="56" y="184" width="190" height="54" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="151.0" y="207.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Open-weight models</text><text x="151.0" y="225.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">weights held locally</text><rect x="264" y="184" width="190" height="54" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="359.0" y="207.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Domain and language</text><text x="359.0" y="225.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">distilled students</text><rect x="56" y="250" width="398" height="50" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="255.0" y="280.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">GPUs on own soil, power and people who run them</text><path d="M300 118 C 300 135, 255 135, 255 146" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="148" width="240" height="50" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="620.0" y="169.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Model registry</text><text x="620.0" y="187.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">versioned, escrowed weights</text><rect x="500" y="210" width="240" height="50" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="620.0" y="231.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Evaluation harness</text><text x="620.0" y="249.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">local tasks and languages</text><rect x="500" y="272" width="240" height="50" rx="8" fill="#fff" stroke="#d9480f" stroke-width="2"/><text x="620.0" y="293.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Distillation pipeline</text><text x="620.0" y="311.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">traces in, students out</text><line x1="498" y1="297" x2="456" y2="211" stroke="#d9480f" stroke-width="2" marker-end="url(#b)"/><line x1="620" y1="260" x2="620" y2="270" stroke="#6c757d" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="340" width="700" height="50" rx="8" fill="#fff" stroke="#adb5bd" stroke-width="2"/><text x="390.0" y="370.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Data stays under local law: prompts, traces, training sets</text><line x1="776" y1="40" x2="776" y2="408" stroke="#d9480f" stroke-width="3" stroke-dasharray="8 6"/><text x="776" y="428" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#d9480f">border</text><rect x="796" y="56" width="170" height="62" rx="8" fill="#fff" stroke="#6c757d" stroke-width="2"/><text x="881.0" y="83.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Frontier API</text><text x="881.0" y="101.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">foreign, metered</text><path d="M424 80 C 600 60, 700 60, 794 80" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="610" y="56" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6c757d">non-sensitive work, optional</text><rect x="796" y="250" width="170" height="72" rx="8" fill="#fff" stroke="#6c757d" stroke-width="2"/><text x="881.0" y="273.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">Frontier teacher</text><text x="881.0" y="291.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">under contract:</text><text x="881.0" y="309.0" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6c757d">labels, grading</text><path d="M796 296 C 770 296, 760 297, 742 297" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/></svg>