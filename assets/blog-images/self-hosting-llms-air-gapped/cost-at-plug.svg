<text x="478.7" y="153" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">$2.55</text>
<rect x="220" y="160" width="177.3" height="16" fill="#d9480f"/>
<text x="403.3" y="173" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d9480f">$0.49</text>
<text x="20" y="232" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">8B, batch of 32</text>
<rect x="220" y="210" width="121.0" height="16" fill="#adb5bd" opacity="0.6"/>
<text x="347.0" y="223" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">$0.14</text>
<rect x="220" y="230" width="45.6" height="16" fill="#d9480f"/>
