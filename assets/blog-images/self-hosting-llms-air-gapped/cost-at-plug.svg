<rect x="220" y="304" width="14" height="10" fill="#d9480f"/><text x="240" y="314" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">electricity only</text>
<rect x="370" y="304" width="14" height="10" fill="#adb5bd" opacity="0.6"/><text x="390" y="314" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">electricity + hardware over 3 years</text>
