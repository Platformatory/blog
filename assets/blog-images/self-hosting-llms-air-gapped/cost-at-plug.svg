<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Cost per million tokens on one appliance, electricity only and with amortisation">
<rect width="720" height="330" fill="#ffffff"/>
<text x="20" y="30" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#6c757d">US$ per million tokens, log scale (illustrative: 240 W, $0.15/kWh, $3,999 over 3 years)</text>
<line x1="220.0" y1="50" x2="220.0" y2="270" stroke="#e9ecef"/>
<text x="220.0" y="290" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">1¢</text>
<line x1="325.0" y1="50" x2="325.0" y2="270" stroke="#e9ecef"/>
<text x="325.0" y="290" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">10¢</text>
<line x1="430.0" y1="50" x2="430.0" y2="270" stroke="#e9ecef"/>
<text x="430.0" y="290" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">$1</text>
<line x1="535.0" y1="50" x2="535.0" y2="270" stroke="#e9ecef"/>
<text x="535.0" y="290" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">$10</text>
<line x1="640.0" y1="50" x2="640.0" y2="270" stroke="#e9ecef"/>
<text x="640.0" y="290" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">$100</text>
<text x="20" y="92" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">70B dense, 1 user</text>
<rect x="220" y="70" width="345.1" height="16" fill="#adb5bd" opacity="0.6"/>
<text x="571.1" y="83" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6c757d">$19.36</text>
<rect x="220" y="90" width="269.7" height="16" fill="#d9480f"/>
<text x="495.7" y="103" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#d9480f">$3.70</text>
<text x="20" y="162" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">8B, 1 user</text>
